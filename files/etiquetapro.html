<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EtiquetaPro — Desativado</title>
<style>
  :root{
    --bg:#0e0e12; --surface:#16161d; --border:#2a2a38;
    --text:#e8e8f0; --muted:#8a8aa0; --accent:#f0c040;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.6;
  }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:40px 36px; max-width:520px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.45); text-align:center;
  }
  .marca{
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); margin-bottom:28px;
  }
  .marca b{color:var(--accent); font-weight:700}
  .icone{font-size:44px; margin-bottom:18px; display:block}
  h1{font-size:21px; font-weight:700; margin-bottom:14px}
  p{color:var(--muted); font-size:15px; margin-bottom:14px}
  .sistema{
    display:inline-block; margin-top:6px; padding:7px 16px;
    background:#1e1e28; border:1px solid var(--border); border-radius:999px;
    font-size:13px; font-family:'DM Mono',Consolas,monospace; color:var(--text);
  }
  .rodape{
    margin-top:30px; padding-top:20px; border-top:1px solid var(--border);
    font-size:13px; color:var(--muted);
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f4f7; --surface:#fff; --border:#e2e2ea; --text:#1a1a22; --muted:#6b6b80}
    .sistema{background:#f4f4f7}
    .card{box-shadow:0 10px 40px rgba(0,0,0,.08)}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="marca">Etiqueta<b>Pro</b> · Reino Alimentos</div>

    <span class="icone">🔒</span>
    <h1>Sistema desativado</h1>

    <p>Este sistema foi desativado e não está mais disponível para uso.</p>
    <p>Se você precisa emitir etiquetas, procure o setor de TI.</p>

    <div class="sistema">Processo Principal</div>

    <div class="rodape">
      Registros e histórico continuam preservados no SharePoint.
    </div>
  </div>
</body>
</html>
